<svg viewBox="0 0 980 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">UNC6395 lab architecture</title>
  <desc id="desc">Three swimlanes. Attacker and supply chain on the left, Salesforce Developer Edition victim tenant in the middle, detection layer with three Sigma rules on the right. The victim lane separates defender-side evidence, which validates rules, from attacker-side logs, which do not. R1 alerted on the Setup Audit Trail, R2 ran against Login History and correctly stayed silent, and R3 is partial because the API Usage tile is org-wide.</desc>

  <style>
    .lane-bg { fill: #f5f5f7; stroke: #d8dae0; stroke-width: 1; }
    .lane-label { font: 600 12px system-ui, -apple-system, Segoe UI, sans-serif; fill: #5a6478; letter-spacing: 0.06em; text-transform: uppercase; }
    .group-label { font: 600 10px system-ui, -apple-system, Segoe UI, sans-serif; fill: #5a6478; letter-spacing: 0.04em; text-transform: uppercase; }
    .box { fill: #ffffff; stroke: #c9cdd6; stroke-width: 1.25; rx: 6; ry: 6; }
    .box-title { font: 600 13px system-ui, -apple-system, Segoe UI, sans-serif; fill: #1a1a2e; }
    .box-sub { font: 11px system-ui, -apple-system, Segoe UI, sans-serif; fill: #5a6478; }
    .box-fires { stroke: #16a34a; stroke-width: 2.25; }
    .box-truneg { stroke: #2563eb; stroke-width: 2.25; }
    .box-partial { stroke: #d97706; stroke-width: 2.25; stroke-dasharray: 5 3; }
    .box-nodata { stroke: #94a3b8; stroke-width: 1.25; stroke-dasharray: 4 3; fill: #f8fafc; }
    .box-defender { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; }
    .box-attacker { fill: #fafafa; stroke: #94a3b8; stroke-width: 1.25; stroke-dasharray: 4 3; }
    .arrow { stroke: #4a5568; stroke-width: 1.5; fill: none; }
    .arrow-partial { stroke: #d97706; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .arrow-label { font: 10px system-ui, -apple-system, Segoe UI, sans-serif; fill: #5a6478; }
    .legend-text { font: 11px system-ui, -apple-system, Segoe UI, sans-serif; fill: #1a1a2e; }
    .note { font: italic 10px system-ui, -apple-system, Segoe UI, sans-serif; fill: #8a93a5; }
  </style>

  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <marker id="arrowhead-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="980" height="700" fill="#ffffff"/>

  <rect class="lane-bg" x="20" y="50" width="260" height="620" rx="8"/>
  <rect class="lane-bg" x="300" y="50" width="380" height="620" rx="8"/>
  <rect class="lane-bg" x="700" y="50" width="260" height="620" rx="8"/>

  <text class="lane-label" x="40" y="38">Attacker / Supply Chain</text>
  <text class="lane-label" x="320" y="38">Salesforce Dev Edition (Victim)</text>
  <text class="lane-label" x="720" y="38">Detection Layer</text>

  <rect class="box" x="50" y="80" width="200" height="60"/>
  <text class="box-title" x="60" y="102">Attacker host</text>
  <text class="box-sub" x="60" y="120">curl, Python, TruffleHog v3</text>

  <rect class="box" x="50" y="170" width="200" height="80"/>
  <text class="box-title" x="60" y="192">Bait GitHub repo</text>
  <text class="box-sub" x="60" y="210">threathunter-truffle-target</text>
  <text class="box-sub" x="60" y="226">config/secrets.yaml</text>
  <text class="box-sub" x="60" y="242">FAKE refresh token</text>

  <rect class="box" x="50" y="280" width="200" height="60"/>
  <text class="box-title" x="60" y="302">Verify probe</text>
  <text class="box-sub" x="60" y="320">User-Agent: truffleHog</text>

  <rect class="box" x="320" y="80" width="340" height="100"/>
  <text class="box-title" x="332" y="102">External Client App: Drift_Integration</text>
  <text class="box-sub" x="332" y="122">consumer ID 888g5000000OC3G</text>
  <text class="box-sub" x="332" y="138">scopes: api + refresh_token + offline_access</text>
  <text class="box-sub" x="332" y="154">Refresh Token Policy: Infinite</text>
  <text class="box-sub" x="332" y="170">callback http://localhost:8080/callback</text>

  <rect class="box" x="320" y="200" width="340" height="60"/>
  <text class="box-title" x="332" y="222">[1] OAuth Web Server Flow</text>
  <text class="box-sub" x="332" y="240">access_token + refresh_token captured</text>

  <rect class="box" x="320" y="280" width="340" height="60"/>
  <text class="box-title" x="332" y="302">[2] Recon flat REST calls</text>
  <text class="box-sub" x="332" y="320">/sobjects/  /Account/describe/  /limits/</text>

  <rect class="box" x="320" y="360" width="340" height="60"/>
  <text class="box-title" x="332" y="382">[3] 51 SOQL queries in 31s</text>
  <text class="box-sub" x="332" y="400">UA: truffleHog on every request</text>

  <text class="group-label" x="320" y="444">Defender-side evidence</text>

  <rect class="box box-defender" x="320" y="466" width="105" height="52"/>
  <text class="box-title" x="328" y="486">Audit Trail</text>
  <text class="box-sub" x="328" y="502">consent png</text>

  <rect class="box box-defender" x="437" y="466" width="105" height="52"/>
  <text class="box-title" x="445" y="486">Login History</text>
  <text class="box-sub" x="445" y="502">oauth png</text>

  <rect class="box box-defender" x="555" y="466" width="105" height="52"/>
  <text class="box-title" x="563" y="486">API Usage</text>
  <text class="box-sub" x="563" y="502">55 / 15000</text>

  <text class="group-label" x="320" y="548">Attacker-side, not evidence</text>

  <rect class="box box-attacker" x="320" y="556" width="340" height="55"/>
  <text class="box-title" x="332" y="577">recon_burst.log + terminal png</text>
  <text class="box-sub" x="332" y="595">the script writes this about itself</text>

  <rect class="box box-fires" x="720" y="120" width="220" height="52"/>
  <text class="box-title" x="730" y="141">R1  Ext Client App consent</text>
  <text class="box-sub" x="730" y="159">T1528  alerted</text>

  <rect class="box box-truneg" x="720" y="196" width="220" height="52"/>
  <text class="box-title" x="730" y="217">R2  OAuth, no human before</text>
  <text class="box-sub" x="730" y="235">T1550.001  ran, correctly silent</text>

  <rect class="box box-partial" x="720" y="272" width="220" height="52"/>
  <text class="box-title" x="730" y="293">R3  Volume burst &gt;50 / 5min</text>
  <text class="box-sub" x="730" y="311">T1087.004  partial</text>

  <rect class="box" x="720" y="380" width="220" height="52"/>
  <text class="box-title" x="730" y="401">validation/Validation.md</text>
  <text class="box-sub" x="730" y="419">per-rule result and basis</text>

  <g transform="translate(722, 466)">
    <rect class="box box-fires" x="0" y="0" width="14" height="10"/>
    <text class="legend-text" x="20" y="9">alerted</text>
    <rect class="box box-truneg" x="0" y="20" width="14" height="10"/>
    <text class="legend-text" x="20" y="29">ran, no alert</text>
    <rect class="box box-partial" x="0" y="40" width="14" height="10"/>
    <text class="legend-text" x="20" y="49">partial, coarse source</text>
  </g>

  <text class="note" x="722" y="556">Detections needing Shield or an</text>
  <text class="note" x="722" y="570">Entra ID tenant are not shipped.</text>
  <text class="note" x="722" y="584">See matrix/README.md.</text>

  <path class="arrow" d="M 150 140 L 150 170" marker-end="url(#arrowhead)"/>
  <text class="arrow-label" x="158" y="160">scan</text>

  <path class="arrow" d="M 150 250 L 150 280" marker-end="url(#arrowhead)"/>
  <text class="arrow-label" x="158" y="270">found token</text>

  <path class="arrow" d="M 250 110 C 290 110, 290 130, 320 130" marker-end="url(#arrowhead)"/>
  <text class="arrow-label" x="258" y="100">consent</text>

  <path class="arrow" d="M 250 310 C 290 310, 290 230, 320 230" marker-end="url(#arrowhead)"/>
  <text class="arrow-label" x="258" y="272">token use</text>

  <path class="arrow" d="M 490 180 L 490 200" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M 490 260 L 490 280" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M 490 340 L 490 360" marker-end="url(#arrowhead)"/>

  <path class="arrow" d="M 490 420 L 490 452"/>
  <path class="arrow" d="M 372 452 L 608 452"/>
  <path class="arrow" d="M 372 452 L 372 466" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M 490 452 L 490 466" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M 608 452 L 608 466" marker-end="url(#arrowhead)"/>

  <path class="arrow" d="M 660 492 C 690 492, 690 146, 720 146" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M 660 492 C 690 492, 690 222, 720 222" marker-end="url(#arrowhead)"/>
  <path class="arrow-partial" d="M 660 492 C 690 492, 690 298, 720 298" marker-end="url(#arrowhead-amber)"/>

  <path class="arrow" d="M 830 324 L 830 380" marker-end="url(#arrowhead)"/>
</svg>
